# Integración continua para pull requests: valida datos, calidad de código, tests y build.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validar, testear y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar datos comerciales
        run: npm run data:validate
      - name: Lint y formato (Biome)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Tests unitarios y de componentes (Vitest)
        run: npm test
      - name: Build de producción
        run: npm run build
      - name: Presupuesto de rendimiento
        run: npm run perf:budget

  # La imagen oficial de Playwright trae los navegadores y sus dependencias del sistema ya instalados, y
  # Playwright exige que su versión coincida con la del paquete (https://playwright.dev/docs/docker):
  # si no, no encuentra los ejecutables. Por eso la etiqueta sale del propio package-lock.json y no de un
  # número escrito a mano: cuando Dependabot suba Playwright, la imagen sube con él.
  playwright-version:
    name: Versión de Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.leer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: leer
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    # Un trabajo por grupo de pruebas, y los grupos son por tema (tests/e2e/grupos.ts): el nombre de
    # un trabajo en rojo ya dice qué se rompió. Ninguno de estos nombres está en la regla de la rama
    # `main`: la regla exige solo el trabajo "CI (resultado)" de abajo, que espera a todos. Así se
    # puede repartir o fusionar grupos sin tocar Settings, Rules.
    name: E2E (${{ matrix.base }}, ${{ matrix.nombre }})
    needs: [checks, playwright-version]
    runs-on: ubuntu-latest
    # Dentro de la imagen oficial de Playwright (https://playwright.dev/docs/ci, "Via Containers"). Antes
    # cada trabajo instalaba los navegadores en el runner con `--with-deps`: apt tenía que bajar unos 119 MB
    # (181 paquetes, sobre todo de WebKit) del espejo de Ubuntu, que a veces va a unos 50 KB/s. Una vez
    # tardó 25 minutos, otra vez no llegó ni a los 12 con tres intentos, y ningún tope o reintento arregla
    # que la red esté lenta. La imagen se descarga del registro de Microsoft y no hay nada que instalar.
    # `--user 1001` es el de la documentación de Playwright (el usuario del runner, para que el
    # espacio de trabajo siga siendo escribible) y `--ipc=host` y `--init` los que recomienda para Chromium.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host --init
    # Red de seguridad por encima de todo lo demás. Playwright corta antes con `globalTimeout` (55
    # minutos, en playwright.config.ts) y los pasos tienen su propio tope, así que este solo salta si
    # algo se cuelga fuera de ellos.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        # Cada grupo tiene que estar en las dos bases y cada base ha de sumar todos los grupos:
        # scripts/ci/grupos-e2e.test.ts lo comprueba.
        #
        # La raíz corre los cuatro proyectos (escritorio, móvil, tableta y WebKit de iPhone), un
        # trabajo por grupo. La subruta se sigue probando para detectar rutas absolutas mal escritas
        # y mantener el proyecto portable a otro hosting, pero solo en escritorio: esa clase de error
        # se rompe igual en cualquier navegador. Son dos trabajos y no seis para no pasar de los 20
        # trabajos simultáneos del plan gratuito de la organización.
        include:
          - id: raiz-fichas
            base: '/'
            nombre: 'fichas y búsqueda'
            grupos: 'fichas'
          - id: raiz-interfaz
            base: '/'
            nombre: 'interfaz y accesibilidad'
            grupos: 'interfaz'
          - id: raiz-rutas
            base: '/'
            nombre: 'rutas, SEO y panel'
            grupos: 'rutas'
          - id: raiz-mapa-capas
            base: '/'
            nombre: 'mapa: capas y datos'
            grupos: 'mapa-capas'
          - id: raiz-mapa-realismo
            base: '/'
            nombre: 'mapa: realismo y títulos'
            grupos: 'mapa-realismo'
          - id: raiz-mapa-uso
            base: '/'
            nombre: 'mapa: medición, táctil y errores'
            grupos: 'mapa-uso'
          - id: subruta-contenido
            base: '/visit-zibata/'
            nombre: 'contenido'
            grupos: 'fichas interfaz rutas'
            args: '--project=desktop'
          - id: subruta-mapa
            base: '/visit-zibata/'
            nombre: 'mapa'
            grupos: 'mapa-capas mapa-realismo mapa-uso'
            args: '--project=desktop'
    env:
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
        timeout-minutes: 10
      - name: Build de producción
        run: npm run build
        timeout-minutes: 10
      - name: Pruebas E2E
        run: npx playwright test $(node scripts/ci/archivos-del-grupo.ts ${{ matrix.grupos }}) ${{ matrix.args }}
        timeout-minutes: 60
      - name: Tiempo de prueba por archivo
        if: ${{ !cancelled() }}
        run: node scripts/ci/resumen-tiempos.ts >> "$GITHUB_STEP_SUMMARY"
      # También en los pasados: sin un informe completo no se puede medir qué pruebas pesan.
      - name: Informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: informe-${{ matrix.id }}
          path: playwright-report
          retention-days: 7

  secrets:
    name: Búsqueda de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # El binario y no gitleaks-action (exige clave de licencia en organizaciones), verificado por hash y con
      # caché. Todo vive en .github/actions/gitleaks y scripts/ci/gitleaks.sh.
      - name: Escanear con Gitleaks
        uses: ./.github/actions/gitleaks

  # La única comprobación que la regla de la rama `main` exige para las pruebas E2E. Espera a todo
  # lo demás y falla si algo no terminó en verde, también si se saltó (por ejemplo, porque `checks`
  # falló y los E2E ni empezaron). `if: always()` hace que corra aunque lo anterior falle: sin él,
  # un trabajo omitido contaría como ni verde ni rojo y la regla se quedaría esperando.
  resultado:
    name: CI (resultado)
    if: ${{ always() }}
    needs: [checks, playwright-version, secrets, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar que todo terminó en verde
        env:
          NECESITA: ${{ toJSON(needs) }}
        run: |
          node -e '
            const fallos = Object.entries(JSON.parse(process.env.NECESITA))
              .filter(([, trabajo]) => trabajo.result !== "success")
              .map(([nombre, trabajo]) => nombre + ": " + trabajo.result);
            if (fallos.length > 0) {
              console.error("No terminó en verde: " + fallos.join(", "));
              process.exit(1);
            }
            console.log("Todo en verde.");
          '
