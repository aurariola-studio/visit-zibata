# Integración continua para pull requests: valida datos, calidad de código, tests y build.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validar, testear y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar datos comerciales
        run: npm run data:validate
      - name: Lint y formato (Biome)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Tests unitarios y de componentes (Vitest)
        run: npm test
      - name: Build de producción
        run: npm run build
      - name: Presupuesto de rendimiento
        run: npm run perf:budget

  e2e:
    name: E2E (Playwright, base ${{ matrix.base }})
    needs: checks
    runs-on: ubuntu-latest
    # 60 y no 40: al soltar las teselas del mapa (v4.7.0) cada vista pide una veintena de archivos
    # donde antes hacía unas pocas lecturas por rango, y la suite pasó de 24 a 34-40 minutos aquí.
    # Es un costo del banco de pruebas, no de la guía publicada: `vite preview` habla HTTP/1.1 y
    # serializa, mientras que el sitio real se sirve por h2/h3 y esas peticiones van multiplexadas
    # sobre una sola conexión. Con 40 la ejecución en subruta se canceló por tiempo con todo en verde.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # El sitio se sirve en la raíz, pero se sigue probando una subruta: es lo que detecta una
        # ruta absoluta mal escrita antes de publicarla, y mantiene el proyecto portable a otro hosting.
        base: ['/', '/visit-zibata/']
    env:
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7

  secrets:
    name: Búsqueda de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Se usa el binario y no gitleaks-action: esa acción exige clave de licencia cuando el
      # repositorio vive en una organización, y desde el traslado a aurariola-studio vive en una.
      # El binario es el mismo escáner, MIT y sin clave. La versión va fijada, igual que las
      # acciones van fijadas por SHA.
      - name: Escanear con Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1
