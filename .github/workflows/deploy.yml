# Publicación en Cloudflare Pages: install → validate → test → build → presupuesto → e2e → deploy.
#
# Se compila y se publica desde aquí, y NO con la integración de Git de Cloudflare, a propósito: esa
# integración compila por su cuenta y no corre las pruebas, así que publicaría igual con el
# presupuesto de peso roto, con axe en rojo o con los tests de CSP fallando. Las puertas de este
# repositorio solo sirven si nada se publica sin pasarlas.
#
# Requisitos en GitHub (Settings → Secrets and variables → Actions):
#   secreto  CLOUDFLARE_API_TOKEN    token con permiso "Cloudflare Pages: Edit"
#   secreto  CLOUDFLARE_ACCOUNT_ID   id de la cuenta de Cloudflare
#   variable PAGES_SITE_URL          URL pública con barra final (p. ej. https://visitzibata.com/)
#
# En Cloudflare, el proyecto de Pages debe quedar SIN integración de Git (Direct Upload).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: visit-zibata

jobs:
  deploy:
    name: Validar, testear, compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: cloudflare-pages
      url: ${{ steps.publicar.outputs.url }}
    env:
      # Cloudflare Pages sirve en la raíz del dominio, así que la base es "/".
      BASE_PATH: /
      SITE_URL: ${{ vars.PAGES_SITE_URL || format('https://{0}.pages.dev/', 'visit-zibata') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar datos comerciales
        run: npm run data:validate
      - name: Lint, tipos y tests
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build de producción
        run: npm run build
      - name: Presupuesto de rendimiento
        run: npm run perf:budget
      - name: E2E contra el build
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Publicar en Cloudflare Pages
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true
          echo "url=https://$PAGES_PROJECT.pages.dev/" >> "$GITHUB_OUTPUT"
