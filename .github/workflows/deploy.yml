# Publicación en Cloudflare: install → validate → test → build → imágenes → presupuesto → e2e → deploy.
#
# Se compila y se publica desde aquí, y NO con la integración de Git de Cloudflare, a propósito: esa
# integración compila por su cuenta y no corre las pruebas, así que publicaría igual con el
# presupuesto de peso roto, con axe en rojo o con los tests de CSP fallando. Las puertas de este
# repositorio solo sirven si nada se publica sin pasarlas.
#
# El destino es un Worker con assets estáticos (ver wrangler.jsonc), no un proyecto de Pages:
# Cloudflare está integrando Pages dentro de Workers y los sitios nuevos se crean así.
#
# Requisitos en GitHub (Settings → Secrets and variables → Actions):
#   secreto  CLOUDFLARE_API_TOKEN    token de la plantilla "Edit Cloudflare Workers"
#   secreto  CLOUDFLARE_ACCOUNT_ID   id de la cuenta de Cloudflare
#   variable PAGES_SITE_URL          opcional; por omisión https://visitzibata.com/
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar, testear, compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: cloudflare
      url: ${{ steps.publicar.outputs.url }}
    env:
      # El sitio se sirve en la raíz del dominio, así que la base es "/".
      BASE_PATH: /
      SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://visitzibata.com/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Gitleaks escanea la historia, no solo el árbol de trabajo.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # También aquí y no solo en ci.yml: ese workflow corre en pull requests, así que mientras
      # todo fue directo a main no se ejecutó ni una vez. Con el binario y no con la acción, que
      # pide clave de licencia en organizaciones.
      - name: Escanear con Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1
      - name: Validar datos comerciales
        run: npm run data:validate
      - name: Lint, tipos y tests
        run: |
          npm run lint
          npm run typecheck
          npm test
      # Antes del build porque la composición de las imágenes de vista previa también usa Chromium.
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Build de producción
        run: npm run build
      # Después del build, nunca antes: el build limpia dist/, así que unas imágenes generadas
      # primero desaparecerían sin dejar rastro y cada enlace compartido volvería a la imagen de
      # la portada.
      - name: Imágenes de vista previa por local
        run: npm run images:og-places
      - name: Presupuesto de rendimiento
        run: npm run perf:budget
      - name: E2E contra el build
        run: npm run test:e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Publicar en Cloudflare
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          echo "url=${{ vars.PAGES_SITE_URL || 'https://visitzibata.com/' }}" >> "$GITHUB_OUTPUT"
