version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 6.16 mueve el estarcido a un contexto por fotograma y deja de exponer la transformación en el
      # painter: de ahí cuelgan las sombras en vivo y el límite de alejamiento de la cámara.
      - dependency-name: maplibre-gl
        versions: ['>=6.11.0']
    groups:
      mapa:
        patterns: ["maplibre-gl", "pmtiles", "@maplibre/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "@testing-library/*", "@axe-core/*", "jsdom"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
